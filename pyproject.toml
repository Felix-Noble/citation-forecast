[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = 'citation-forecast'
description = 'Forecast academic impact (citation count/percentile) with NLP'

version = '0.2.1'
requires-python = '>=3.13'

readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']

dependencies = [
    'polars==1.38.1',
    'pandas==2.3.3',
    'mlflow==3.9.0',
    'torch==2.10.0',
    'scikit-learn==1.8.0',
    'typer==0.23.1',
]

authors = [
    { name = 'Felix Noble', email = 'felix.noble@live.co.uk' }
]
